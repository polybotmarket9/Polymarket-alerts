name: API probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > s.py <<'PY'
          import sys, json
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              if isinstance(d, list):
                  print("n=", len(d), [(x.get("realizedPnl"), x.get("timestamp"), x.get("pnl"), x.get("userName")) for x in d[:6]])
              else:
                  print(d)
          except Exception:
              print(raw[:400])
          PY
          D=https://data-api.polymarket.com
          W=$(curl -s "$D/trades?limit=1&filterType=CASH&filterAmount=5000" | python3 -c 'import json,sys;print(json.load(sys.stdin)[0]["proxyWallet"])')
          echo "wallet=$W"
          for u in "closed-positions?user=$W&limit=5&sortBy=TIMESTAMP&sortDirection=DESC" "closed-positions?user=$W&limit=500&offset=0" "v1/leaderboard?timePeriod=all&orderBy=PNL&user=$W" "v1/leaderboard?timePeriod=month&orderBy=PNL&limit=1&user=$W"; do
            echo "=== $u"; curl -s "$D/$u" | python3 s.py
          done
