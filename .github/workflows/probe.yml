name: Key check (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          for u in https://api.x.ai/v1/models https://api.grok.com/v1/models https://grok.com/api/v1/models https://api.x.ai/v1/api-key; do
            echo "== $u"
            curl -sS -m 20 -o out.txt -w "%{http_code}\n" -H "Authorization: Bearer $XAI_API_KEY" "$u" || true
            head -c 300 out.txt; echo
          done
