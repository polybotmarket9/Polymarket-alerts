name: Match check (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > p.py <<'PY'
          import random, alert_bot as ab
          from collections import Counter
          cfg = ab.Config()
          cat = ab.fetch_us_catalog()
          mk = ab.fetch_markets(cfg)
          print("US markets", len(cat["all"]), ".com markets", len(mk))
          hits, by = [], Counter()
          for cid, m in mk.items():
              for side in m["outcomes"][:2]:
                  h = ab.match_us(cat, m["slug"], m["question"], side)
                  if h:
                      hits.append((m["cat"], m["question"], side, h["event"], h["title"], h["button"])); by[m["cat"]] += 1
          print("matched sides by category", by)
          random.seed(1)
          for row in random.sample(hits, min(80, len(hits))):
              print(" | ".join(map(str, row)))
          PY
          python3 p.py
