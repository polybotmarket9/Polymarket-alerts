name: API probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request
          from collections import Counter
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "probe"}), timeout=30) as r:
                  return json.loads(r.read().decode())
          G = "https://gateway.polymarket.us"
          evs, off = [], 0
          while off < 20000:
              d = get(f"{G}/v1/events?limit=200&offset={off}&active=true&closed=false")["events"]
              evs += d; off += 200
              if len(d) < 200: break
          print("open events", len(evs), "markets", sum(len(e.get("markets", [])) for e in evs))
          print(Counter(e.get("category") for e in evs))
          games = [e for e in evs if e.get("startTime") and "2026-10-1" in (e.get("startTime") or "")]
          print("games soon", len(games))
          for e in evs:
              if "nfl" in e["slug"] and ("2026-10-19" in e["slug"] or "2026-10-20" in e["slug"]):
                  print("NFL", e["slug"], "|", e.get("title"), "|", [(m["slug"], m.get("sportsMarketType"), m.get("title"), m.get("outcomes")) for m in e.get("markets", [])][:8])
          for e in evs:
              if "btc" in e["slug"] or "bitcoin" in (e.get("title") or "").lower():
                  print("BTC", e["slug"], "|", e.get("title"), "|", [m.get("title") for m in e.get("markets", [])][:5])
          for e in [e for e in evs if e.get("category") in ("politics", "finance", "technology")][:15]:
              print("OTHER", e.get("category"), e["slug"], "|", e.get("title"), "|", [m.get("title") for m in e.get("markets", [])][:4])
          PY
          python3 p.py
