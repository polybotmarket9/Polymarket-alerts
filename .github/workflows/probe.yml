name: API probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request
          from collections import Counter
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "probe"}), timeout=30) as r:
                  return json.loads(r.read().decode())
          G = "https://gateway.polymarket.us"
          evs, off = [], 0
          while off < 20000:
              d = get(f"{G}/v1/events?limit=200&offset={off}&active=true&closed=false")["events"]
              evs += d; off += 200
              if len(d) < 200: break
          print("open events", len(evs), "markets", sum(len(e.get("markets", [])) for e in evs))
          print(Counter(e.get("category") for e in evs))
          for e in evs:
              if "-dal-" in e["slug"] or "-gb-" in e["slug"] or "cowboys" in (e.get("title") or "").lower():
                  print("DAL", e["slug"], "|", e.get("title"), "|", e.get("startTime"), "|", [(m["slug"], m.get("sportsMarketType"), m.get("sportsMarketTypeV2"), m.get("title"), m.get("subtitle"), m.get("outcomes"), m.get("outcomePrices")) for m in e.get("markets", [])][:12])
          sm = Counter()
          for e in evs:
              for m in e.get("markets", []): sm[(m.get("sportsMarketTypeV2") or m.get("sportsMarketType"))] += 1
          print(sm.most_common(20))
          import re
          print(Counter(re.sub(r"-.*", "", e["slug"]) for e in evs).most_common(30))
          PY
          python3 p.py
