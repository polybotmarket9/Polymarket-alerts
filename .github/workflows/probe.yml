name: News check (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > p.py <<'PY'
          import alert_bot as ab
          for t in ["Ningbo Open: Elise Mertens vs Leylah Fernandez", "Will Pete Buttigieg win the 2028 US Presidential Election?",
                    "Will Bitcoin reach $100,000 in October?", "Will Taylor Rogers be the next White House Press Secretary?",
                    "Bab el-Mandeb Strait effectively closed by December 31?"]:
              n = ab.fetch_news(t)
              print(repr(ab.news_query(t)), "->", None if n is None else [(h["title"][:60], h["source"], ab.ago(h["age"])) for h in n])
          PY
          python3 p.py
