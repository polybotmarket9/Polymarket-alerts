name: API probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "probe"}), timeout=30) as r:
                  return json.loads(r.read().decode())
          G = "https://gateway.polymarket.us"
          ms, off = [], 0
          while off < 5000:
              d = get(f"{G}/v1/markets?limit=500&offset={off}&active=true&closed=false")["markets"]
              ms += d; off += 500
              if len(d) < 500: break
          print("open markets", len(ms))
          from collections import Counter
          print(Counter(m.get("category") for m in ms))
          print(Counter(m.get("sportsMarketType") for m in ms).most_common(12))
          for m in ms:
              if "dal" in m["slug"] and "gb" in m["slug"]:
                  print("DALGB", m["slug"], "|", m.get("title"), "|", m.get("question"), "|", m.get("subtitle"), "|", m.get("outcomes"), m.get("outcomePrices"), "|", m.get("sportsMarketType"), "|", [ (x.get("description"), x.get("long"), x.get("price")) for x in m.get("marketSides", [])])
          for cat in ("politics", "crypto", "economics", "culture", "business", "tech"):
              for m in [m for m in ms if m.get("category") == cat][:4]:
                  print(cat.upper(), m["slug"], "|", m.get("title"), "|", m.get("question"), "|", m.get("outcomes"), m.get("outcomePrices"))
          ev = get(f"{G}/v1/events?limit=5&active=true&closed=false")["events"]
          for e in ev: print("EVENT", e["slug"], "|", e.get("title"), "|", [mm["slug"] for mm in e.get("markets", [])][:4])
          PY
          python3 p.py
