name: Trader X probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "probe"}), timeout=30) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  return {"error": str(e)}
          for period in ("month", "all"):
              lb = get(f"https://data-api.polymarket.com/v1/leaderboard?timePeriod={period}&orderBy=PNL&limit=50")
              print(period, "first row:", json.dumps(lb[0] if isinstance(lb, list) and lb else lb)[:600])
              rows = lb if isinstance(lb, list) else []
              print("rows", len(rows), "with x:", sum(1 for r in rows if r.get("xUsername")))
              print([ (r.get("userName"), r.get("xUsername"), r.get("verifiedBadge"), round(float(r.get("pnl") or 0))) for r in rows[:50] if r.get("xUsername")])
          w = rows[0].get("proxyWallet") if rows else ""
          for u in [f"https://gamma-api.polymarket.com/public-profile?address={w}"]:
              print(u, json.dumps(get(u))[:800])
          PY
          python3 p.py
